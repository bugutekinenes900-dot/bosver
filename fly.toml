app = "bosver"
primary_region = "fra"

[build]

[env]
  PARKING_DB = "/data/parking.db"

[mounts]
  source = "bosver_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
